<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>courtyard housing clusters / vimsite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <style>
      /* Override site max-width layout — courtyard page is full-viewport */
      body {
        max-width: 100%;
        padding: 0;
        margin: 0;
        overflow: hidden;
      }

      header {
        padding: 0.75rem var(--gutter) 0;
      }

      .courtyard-layout {
        display: grid;
        grid-template-columns: 1fr 320px;
        height: calc(100vh - 60px);
      }

      /* ── map ────────────────────────────────────────── */
      #courtyard-map {
        width: 100%;
        height: 100%;
        background: var(--bg);
      }

      /* Override Leaflet controls to match terminal theme */
      .leaflet-control-zoom a {
        background: var(--bg-raised) !important;
        color: var(--accent) !important;
        border-color: var(--border) !important;
      }

      .leaflet-control-zoom a:hover {
        background: var(--tag-bg) !important;
      }

      .leaflet-control-attribution {
        background: rgb(10 14 10 / 85%) !important;
        color: var(--fg-dim) !important;
        font-family: var(--font) !important;
        font-size: 0.55rem !important;
      }

      .leaflet-control-attribution a {
        color: var(--fg-dim) !important;
      }

      /* ── right panel ────────────────────────────────── */
      .courtyard-panel {
        background: var(--bg);
        border-left: 1px solid var(--border);
        padding: 1rem;
        overflow-y: auto;
        font-size: 0.8rem;
      }

      .courtyard-panel h2 {
        font-size: 0.9rem;
        color: var(--accent);
        margin-bottom: 0.75rem;
        padding-bottom: 0.35rem;
        border-bottom: 1px dashed var(--border);
      }

      .panel-stats {
        font-size: 0.75rem;
        color: var(--fg-dim);
        margin-bottom: 1rem;
      }

      .panel-meta {
        font-size: 0.6rem;
        color: var(--border);
        margin-top: 0.5rem;
      }

      /* tier legend */
      .tier-legend {
        margin: 1rem 0;
      }

      .tier-legend-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.35rem;
        font-size: 0.7rem;
        color: var(--fg-dim);
      }

      .tier-swatch {
        width: 12px;
        height: 12px;
        border: 1px solid var(--border);
        flex-shrink: 0;
      }

      /* detail panel (populated on click) */
      #detail-panel {
        display: none;
        margin-top: 1rem;
        padding-top: 1rem;
        border-top: 1px solid var(--border);
      }

      #detail-panel.active {
        display: block;
      }

      #detail-panel h3 {
        font-size: 0.85rem;
        color: var(--fg);
        margin-bottom: 0.75rem;
      }

      #detail-panel h4 {
        font-size: 0.7rem;
        color: var(--accent);
        margin: 0.75rem 0 0.35rem;
        letter-spacing: 0.05em;
      }

      .detail-section {
        margin-bottom: 0.5rem;
      }

      .detail-row {
        display: flex;
        justify-content: space-between;
        padding: 0.15rem 0;
        font-size: 0.7rem;
      }

      .detail-label {
        color: var(--fg-dim);
      }

      .detail-value {
        color: var(--fg);
        text-align: right;
      }

      .detail-value.tier-shovel-ready {
        color: #4caf50;
      }
      .detail-value.tier-needs-assembly {
        color: #ff9800;
      }
      .detail-value.tier-zoning-change-needed {
        color: #f44336;
      }

      .detail-addresses {
        list-style: none;
        font-size: 0.65rem;
        color: var(--fg-dim);
        line-height: 1.6;
      }

      .detail-addresses li::before {
        content: '· ';
        color: var(--border);
      }

      /* ── responsive ─────────────────────────────────── */
      @media (width <= 768px) {
        .courtyard-layout {
          grid-template-columns: 1fr;
          grid-template-rows: 1fr auto;
        }

        .courtyard-panel {
          border-left: none;
          border-top: 1px solid var(--border);
          max-height: 40vh;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <nav style="font-size: 0.8rem; color: var(--fg-dim)">
        <a href="index.html">~/log</a> /
        <a href="#" style="color: var(--accent)">courtyard-housing</a>
      </nav>
    </header>

    <div class="courtyard-layout">
      <div id="courtyard-map"></div>

      <aside class="courtyard-panel">
        <h2>courtyard housing clusters</h2>
        <p class="panel-stats" id="cluster-stats">loading...</p>

        <div class="tier-legend">
          <div class="tier-legend-item">
            <span class="tier-swatch" style="background: #4caf50"></span>
            shovel-ready
          </div>
          <div class="tier-legend-item">
            <span class="tier-swatch" style="background: #ff9800"></span>
            needs assembly
          </div>
          <div class="tier-legend-item">
            <span class="tier-swatch" style="background: #f44336"></span>
            zoning change needed
          </div>
        </div>

        <p class="panel-meta" id="pipeline-meta"></p>

        <div id="detail-panel"></div>
      </aside>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="assets/js/courtyard.js"></script>
  </body>
</html>
